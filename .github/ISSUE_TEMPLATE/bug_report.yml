name: Problem report
description: Something doesn't work, crashes or looks wrong in the game or the launcher.
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it! The launcher fills this form in for you: **More > Report a problem on GitHub...**,
        or the window it shows when the game closes unexpectedly. It also opens a folder with your logs.

  - type: textarea
    id: what
    attributes:
      label: What happened, and how can it happen again?
      description: What went wrong, and the steps to make it happen again, as exactly as you can. Screenshots or a short video help (drag them here).
      placeholder: |
        The game closed when I shot the Gravity Repulsor in Zombie Scenario.
        1. Create a Zombie Scenario room with 4 bots
        2. Buy the Gravity Repulsor and shoot
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Versions, Windows, game mode and map
      description: Filled in by the launcher (launcher and mod version, Windows, where the game came from, the last match).
      placeholder: |
        Launcher v1.1.45, mod 1.1.45
        Windows 10.0.19045 (64-bit)
        Last match: mode 15, map de_dust2

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag the files from the folder the launcher opened (mod\logs\report-...) into this box.
      placeholder: Drop game-Error.log.txt, server.log.txt, steambridge.log.txt, launcher.log.txt... here
