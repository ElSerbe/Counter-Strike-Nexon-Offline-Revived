<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Missions</title>
<link rel="stylesheet" href="../shop/style.css">
<link rel="stylesheet" href="missions.css?v=20261107">
</head>
<body>
<header class="topbar">
  <h1>Missions</h1>
  <nav id="tabs" class="tabs">
    <button type="button" data-tab="requests" class="active">Requests</button>
    <button type="button" data-tab="login">Daily Login</button>
    <button type="button" data-tab="event">Event</button>
    <button type="button" data-tab="market">Black Market</button>
    <button type="button" data-tab="rift">Rift Exchange</button>
    <button type="button" data-tab="orders">Orders</button>
    <button type="button" data-tab="challenges">Challenges</button>
  </nav>
  <div class="wallets">
    <div class="wallet badges" title="Black Badges: only missions give them, spent at the Black Market">
      <span class="badge-icon"></span><span id="badges">--</span>
    </div>
    <div class="wallet tickets" title="Rift Tickets: Zombie Disaster Zone, Zombie Scenario, Human Scenario and Zombie Files give them, spent at the Rift Exchange">
      <span class="ticket-icon"></span><span id="tickets">--</span>
    </div>
    <div class="wallet" title="Medals">
      <span class="medal-icon"></span><span id="medals">--</span>
    </div>
  </div>
  <button id="close" class="close" type="button" title="Close (Esc)" aria-label="Close">&times;</button>
</header>

<main id="view"></main>

<div id="toast" class="toast hidden"></div>
<script src="../shop/viewer.js"></script>
<script src="missions.js?v=20261107"></script>
</body>
</html>
