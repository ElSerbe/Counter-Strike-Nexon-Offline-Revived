<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acquisition Centre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button id="back" class="back hidden" type="button">&#8249; Back</button>
  <h1 id="title">Acquisition Centre</h1>
  <nav id="tabs" class="tabs">
    <button type="button" data-tab="passes" class="active">Battle passes</button>
    <a class="tab-link" href="/maps/" title="Your Studio maps, their share codes and the maps other players publish">Studio maps</a>
  </nav>
  <button id="redeem" class="redeem" type="button" title="Gift codes: each one can be used once per account">Redeem code</button>
  <div class="wallet" title="Medals">
    <span class="medal-icon"></span><span id="medals">--</span>
  </div>
  <button id="close" class="close" type="button" title="Close (Esc)">Close &times;</button>
</header>

<main id="view"></main>

<div id="redeem-box" class="redeem-box hidden" role="dialog" aria-label="Redeem a code">
  <form id="redeem-form">
    <h2>Redeem a code</h2>
    <p>Each code can be used once per account. You can also type <b>/redeem &lt;code&gt;</b> in the lobby chat.</p>
    <input id="redeem-code" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="Code">
    <div class="redeem-actions">
      <button type="button" id="redeem-cancel" class="cta ghost">Cancel</button>
      <button type="submit" class="cta">Redeem</button>
    </div>
  </form>
</div>

<div id="toast" class="toast hidden"></div>
<div id="icons-note" class="icons-note hidden" role="note">
  <span><b>Don't see the item pictures?</b> They come from your own game: open the launcher and press <b>Store assets</b> to extract them.</span>
  <button id="icons-note-close" type="button" title="Hide">&times;</button>
</div>
<div id="tooltip" class="tooltip hidden"></div>

<script src="art.js"></script>
<script src="viewer.js"></script>
<script src="app.js"></script>
</body>
</html>
