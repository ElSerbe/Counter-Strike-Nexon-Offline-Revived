# CSNZ Revived online lobby (worker.js), live at https://csnz-revived-lobby.elserbe.workers.dev (the bridge's DefaultLobby).
# Deploy from this folder: npx wrangler login (once), then npx wrangler deploy. With an antivirus that scans HTTPS (Avast),
# set NODE_USE_SYSTEM_CA=1 first, or Node rejects its certificate (UNABLE_TO_VERIFY_LEAF_SIGNATURE).
name = "csnz-revived-lobby"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]
