# CSNZ Revived online lobby (worker.js). Deploy: npx wrangler login (once), then npx wrangler deploy (from this folder).
name = "csnz-revived-lobby"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]
