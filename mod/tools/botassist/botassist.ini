; botassist: companion AI for bots where there are monsters/NPCs (zombie scenario, human scenario, zombie shelter...)
[BotAssist]
; 0 turns it off
Enabled=1
; 1: bots follow you and obey radio orders; 0: they only aim and shoot (their own AI moves them)
Companions=1
; bot skill 0 (easiest) .. 7 (best): turn speed, reaction time and aim; -1 uses the room's bot difficulty
Skill=-1
; how bots talk: normal (their voice lines), radio (only radio commands, shown as text in the chat: the game's bots
; repeat "Get in position and wait for my go" and the like all the time), off (silent)
Voices=off
; 1: bots play any character of the game (botassist_characters.txt) instead of the default ones
RandomCharacters=1
; 1: where there are monsters, bots of the other team kill themselves on spawn (they would spawn under the map)
SameTeam=1
; how far (game units) bots look for monsters to shoot
Radius=2500
; monsters closer than this are watched even when not visible yet
Awareness=1200
; distance bots keep from you when following
FollowDistance=180
; how fast bots turn, degrees per second
TurnRate=540
; widest aim error (degrees) at which bots fire; they use less for small or far monsters
FireCone=6
; monsters closer than this make bots back away while shooting
FleeDistance=350
; 1: bots buy a random weapon from the whole game (botassist_weapons.txt) each time they spawn
BuyAnyWeapon=1
; PvP zombie modes: 1 = human bots back off from zombies in sight closer than ZombieFleeDistance
ZombieFlee=1
ZombieFleeDistance=450
; seconds of firing that spend about half of the ammo: then bots buy ammo when they are in a buy zone
RefillAfterFiring=6
; below this armor bots buy kevlar + helmet when they are in a buy zone
MinArmor=50
; botassist.log: first monster of each kind targeted, and the player commands seen (radio...)
LogTargets=1
LogCommands=1
; aim self-check every 10 s while fighting (shots whose line crosses the target)
LogAim=1
; classnames that are never shot, comma separated (substring match): friendly NPCs the engine flags as monsters
Ignore=hostage,airbot,turret,drone,npc_escort
; debugging: 0 off; 1 botassist_debug.log (what each bot looks at and shoots, what you look at, entities around you);
; 2 also lasers in game: red = bot firing, green = bot has a target, white = no target, yellow = where it wants to hit
Debug=2
; damage per second each zombie pressed against a barricade does to it (0: off; the game alone never damaged them offline)
ZombieBarricadeDamage=40
; barricades zombies break (classnames, comma separated)
Barricades=zbsbreak
; a monster closer than this makes a bot switch from its current target (otherwise it keeps shooting the same one)
ExtremeThreat=160
; 1: when you stand still, bots spread out to open spots around you (a different one each) and move now and then
Roam=1
; game modes with CT spawns only: bots the game puts on T switch to CT
CoopModes=15,17,28,52,53,59
; in follow mode bots never get farther than this from you, fighting or not
Leash=420
; bots shoot the objectives players must break (marked in red) when no monster is in sight, this close (0: off)
ObjectiveRange=1500
; Zombie Giant: how many of the room's AI players (the last ones of the list) join as players who can be the giant (-1: all)
; (the others stay bots: bots can't be the giant); 0 turns it off
ZombieGiantPlayers=-1
; Zombie Giant: 1 lets you be the giant too; 0 leaves it to the fake players
ZombieGiantYouCanBeGiant=1
; Zombie Disaster Zone: random events each round (hazards, special zombies, weapon / zombie modifiers) = rift level /
; this, at most 10, the rest a chance of one more (the game's own value is 32, made for rift levels up to 100)
ZSRiftEventDivisor=3
; Zombie Disaster Zone: money a bot has at least on each new life (the mode pays only once per round), 0: the game's
ZSRiftBotMoney=10000
; Zombie Disaster Zone: how much stronger monsters get for each rift level above 1, in percent (attack and health of
; the zombies, then of the bosses; a negative value keeps the game's table). The room's difficulty tooltip shows them.
; These give at level 20: zombies +50% attack, +300% health; bosses +25% attack, +200% health (19 levels above 1)
ZSRiftMonsterAttack=2.6316
ZSRiftMonsterHealth=15.7895
ZSRiftBossAttack=1.3158
ZSRiftBossHealth=10.5263
; the bonus is rate * (level - 1) ^ this: 1 = the same step every level (the game's 1.85 grows much faster)
ZSRiftLevelExponent=1
